[project]
name = "tab-to-pitch-recall-research"
version = "0.1.0"
description = "Offline, consent-gated recall prediction experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["scikit-learn>=1.6,<2"]
wandb = ["wandb>=0.19,<1"]

[project.scripts]
recall-research = "recall_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall_research"]
